<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/admin.css">
    <title>Administracion</title>
</head>
<body>
    <header>
        <h1>Michell SPA Administracion</h1>
        <button id="logout-button" class="hidden">
            Cerrar Sesion
        </button>
    </header>
    <main>
        <section id="login-section" class="panel">
            <h2>Acceso administrativo</h2>
            <p>Inicia sesion para consultar citas</p>
            <form id="login-form">
                <input id="email" type="email" placeholder="correo electronico" autocomplete="username" required>
                <input id="password" type="password" placeholder="contraseña" autocomplete="current-password" required>
                <button id="login-button" type="submit">
                    Inicia Sesion
                </button>
            </form>
        </section>
        <section id="admin-section" class="panel hidden">
            <h2>Calendario de citas</h2>
            <p id="admin-email"></p>
            <div class="admin-actions">
                <button type="button" id="new-block">
                   🔒 Bloquear horario o día 
                </button>
            </div>
            <div id="calendar">
                <div style="margin-top:20px">
                    <button type="button" id="new-block">
                        Bloquear horario o día
                    </button>
                </div>
                <!-- Detalles y modificación de citas -->
                <dialog id="appointment-dialog">
                    <h2>Detalles de la cita</h2>

                    <p><strong>Cliente:</strong>
                        <span id="detail-name"></span></p>

                    <p><strong>Teléfono:</strong>
                        <span id="detail-phone"></span></p>

                    <p><strong>Servicio:</strong>
                        <span id="detail-service"></span></p>

                    <p><strong>Horario:</strong>
                        <span id="detail-schedule"></span></p>

                    <form id="reschedule-form">
                        <h3>Reprogramar cita</h3>

                        <label for="new-day">Nueva fecha</label>
                        <input type="date" id="new-day" required>

                        <label for="new-time">Nueva hora</label>
                        <input type="time" id="new-time"
                            step="600" required>

                        <button type="submit">
                        Guardar nuevo horario
                        </button>
                    </form>

                    <button type="button" id="cancel-appointment">
                        Cancelar cita
                    </button>

                    <button type="button" id="close-appointment">
                        Cerrar
                    </button>
                </dialog>

                <!-- Bloqueo de horarios -->
                <dialog id="block-dialog">
                    <h2>Bloquear disponibilidad</h2>

                    <form id="block-form">
                        <label for="block-day">Fecha</label>
                        <input type="date" id="block-day" required>

                        <label>
                        <input type="checkbox" id="block-all-day">
                        Bloquear día completo
                        </label>

                        <div id="block-hours">
                        <label for="block-start">Hora inicial</label>
                        <input type="time" id="block-start"
                                value="11:00" step="600">

                        <label for="block-end">Hora final</label>
                        <input type="time" id="block-end"
                                value="14:00" step="600">
                        </div>

                        <label for="block-reason">Motivo</label>
                        <input type="text" id="block-reason"
                            maxlength="200"
                            placeholder="Ej. Descanso o mantenimiento"
                            required>

                        <button type="submit">Guardar bloqueo</button>

                        <button type="button" id="close-block">
                        Cerrar
                        </button>
                    </form>
                </dialog>
            </div>
        </section>
        <p id="message" role="status" aria-live="polite"></p>
    </main>
</body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.22/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.22/locales/es.global.min.js"></script>
<script src="scrip/admin.js" defer></script>
</html>
